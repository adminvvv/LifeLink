plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
}

test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
}

processResources {
    def metadata = [version: project.version,
                    loader_version: project.loader_version,
                    fabric_api_min_version: project.fabric_api_min_version,
                    minecraft_supported_versions: project.minecraft_supported_versions]
    inputs.properties metadata

    filesMatching("fabric.mod.json") {
        expand metadata
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

}

jar {
    def licenseName = "LICENSE_${project.archives_base_name}"
    from('LICENSE') {
        rename { licenseName }
    }
}

sourceSets.main.java.srcDir('common/src/main/java')

// Optional binary compatibility audit; normal release builds are unchanged.
if (project.hasProperty('compatibility_jar')) {
    apply from: 'compatibility/audit.gradle'
}
