plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = "${project.archives_base_name}-mc26" }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
}

sourceSets.main.java.srcDir('../common/src/main/java')

test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
}

processResources {
    // Both Minecraft builds package the same project icon.
    if (!project.hasProperty('compatibility_jar')) {
        from('../src/main/resources/assets') { into 'assets' }
    }
    def metadata = [version: project.version, loader_version: project.loader_version,
        fabric_api_min_version: project.fabric_api_min_version,
        minecraft_supported_versions: project.minecraft_supported_versions]
    inputs.properties metadata
    filesMatching('fabric.mod.json') { expand metadata }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar {
    archiveFileName = "lifelink-${project.version}-mc26.jar"
    from('../LICENSE') { rename { "LICENSE_${project.archives_base_name}" } }
}

if (project.hasProperty('compatibility_jar')) {
    apply from: 'compatibility/audit.gradle'
}
